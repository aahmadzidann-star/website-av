<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimoni — AV OFFICIAL STORE</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">

  <!-- ============ TESTIMONI ============ -->
  <section class="view active" id="view-testimoni">
    <div class="topbar">
      <a class="icon-btn" href="index.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h2>Testimoni</h2>
      <span style="width:38px;"></span>
    </div>
    <div class="page-pad" id="testimoni-list"></div>
  </section>

</div>

<script src="assets/data.js"></script>
<script>
function renderTestimoni(){
  const el = document.getElementById("testimoni-list");
  el.innerHTML = TESTIMONI.map(t=>`
    <div class="t-card">
      <div class="t-head">
        <div class="t-avatar">${t.initial}</div>
        <div>
          <div class="t-name">${t.name}</div>
          <div class="t-stars">${"★".repeat(t.stars)}${"☆".repeat(5-t.stars)}</div>
        </div>
      </div>
      <div class="t-msg">${t.msg}</div>
      <span class="t-tag">${t.tag}</span>
    </div>
  `).join("");
}
renderTestimoni();
</script>
<script type="module" src="assets/analytics.js"></script>
</body>
</html>
