<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang — AV OFFICIAL STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">

  <!-- ============ CART ============ -->
  <section class="view active" id="view-cart">
    <div class="topbar">
      <a class="icon-btn" href="/menu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h2>Keranjang</h2>
    </div>
    <div class="page-pad" style="padding-bottom:40px;">
      <div id="cart-list"></div>
      <div id="cart-empty" class="empty-state" style="display:none;">
        <div class="ic">🛒</div>
        <div>Keranjang kamu masih kosong.</div>
        <div style="margin-top:14px;">
          <a class="portal-btn primary" style="display:inline-flex;max-width:220px;" href="/menu">
            <span class="portal-text"><div class="t1">Mulai Order</div></span>
          </a>
        </div>
      </div>
      <div class="cart-summary" id="cart-summary" style="display:none;">
        <div class="sum-row"><span id="cart-count-label">0 item</span><span id="cart-subtotal">Rp0</span></div>
        <div class="sum-row total"><span>Total</span><span id="cart-total">Rp0</span></div>
        <button class="checkout-btn" onclick="checkoutWA()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.4.8 3.1 1.3 4.8 1.3z"/></svg>
          Checkout via WhatsApp
        </button>
        <div class="note-box">Kamu akan diarahkan ke WhatsApp admin dengan rincian pesanan otomatis.</div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

</div>

<script src="assets/data.js"></script>
<script src="assets/cart.js"></script>
<script>
function renderCart(){
  const list = document.getElementById("cart-list");
  const emptyEl = document.getElementById("cart-empty");
  const summary = document.getElementById("cart-summary");
  const entries = Object.entries(cart);
  if(entries.length===0){
    list.innerHTML = "";
    emptyEl.style.display = "block";
    summary.style.display = "none";
    return;
  }
  emptyEl.style.display = "none";
  summary.style.display = "block";
  list.innerHTML = entries.map(([id,qty])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    if(!p) return "";
    return `
    <div class="cart-item">
      <div class="ci-thumb"><img src="${p.img}" alt="${p.name}" class="ci-img"></div>
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-price">${rupiah(p.price)} / item</div>
      </div>
      <div class="stepper">
        <button onclick="changeQty('${p.id}',-1,false)">−</button>
        <span>${qty}</span>
        <button onclick="changeQty('${p.id}',1,false)">+</button>
      </div>
    </div>`;
  }).join("");
  const items = totalItems();
  document.getElementById("cart-count-label").textContent = items + " item";
  document.getElementById("cart-subtotal").textContent = rupiah(totalPrice());
  document.getElementById("cart-total").textContent = rupiah(totalPrice());
}

/* ============ INIT ============ */
renderCart();
</script>
</body>
</html>
